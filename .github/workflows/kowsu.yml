name: Sync KowSU CI Builds

# 自动同步 KOWX712/KernelSU（KowSU）Build Manager 的 manager 产物：
# 完整版管理器 APK（内嵌 arm64/armv7/x86_64/riscv64 的 ksud），发布到本仓库 Releases。
# 与 CI.yml（BakaSU 同步）互不影响：tag 前缀固定为 KowSU_，Release 标题取自 APK 文件名。

on:
  schedule:
    - cron: '43 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-kowsu
  cancel-in-progress: false

env:
  # 每次最多往回检查多少个上游 run（用于增量同步 + 首次回填少量历史）
  N_LATEST_RUNS: 10
  # 上游仓库 / 分支 / Build Manager workflow（.github/workflows/build-manager.yml 的 id）
  TARGET_REPO: KOWX712/KernelSU
  TARGET_BRANCH: master
  TARGET_WORKFLOW_ID: 189547700

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test KowSU sync logic
        run: python3 -m unittest discover -s tests -v

      - name: Fetch KowSU manager APK and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/sync-kowsu.sh
