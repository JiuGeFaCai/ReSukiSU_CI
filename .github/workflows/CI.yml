name: Sync BakaSU CI Builds

# 只同步应用：下载上游 Manager-release 产物（release APK 全家桶）发布到 Releases，
# ksud / lkm(.ko) / ksuinit / mappings / Spoofed-Manager 等其他产物一律不要。

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

env:
  # 可以在这里手动设置需要检查的最新 N 条 Action 数量
  N_LATEST_RUNS: 50
  # ReSukiSU 已改名为 BakaSU
  TARGET_REPO: Baka-SU/BakaSU

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Artifacts and Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting to fetch latest $N_LATEST_RUNS runs from $TARGET_REPO..."

          runs_json=$(gh api "repos/$TARGET_REPO/actions/runs?branch=main&per_page=$N_LATEST_RUNS" \
            | jq -c '[.workflow_runs[] | select(.event != "pull_request")] | reverse | .[] | {id: .id, title: .display_title, url: .html_url}')

          echo "$runs_json" | while read -r run; do
              run_id=$(echo "$run" | jq -r '.id')
              run_title=$(echo "$run" | jq -r '.title')
              run_url=$(echo "$run" | jq -r '.url')
              # 注意：tag 前缀沿用 ReSukiSU_，改动会导致已发布的 release 无法去重而被重复发版
              tag_name="ReSukiSU_${run_id}"

              echo "----------------------------------------"
              echo "Checking run ID: $run_id (Title: $run_title)"

              # 检查此前是否发布过该 tag 的 release
              if gh release view "$tag_name" >/dev/null 2>&1; then
                  echo "⚠️ Release with tag $tag_name already exists. Skipping."
                  continue
              fi

              # 只认 Manager-release 产物（应用 APK；Manager-debug/Spoofed-Manager 等变体不要）。
              # 必须 --paginate：上游一次 run 约 30 个产物，API 默认 30 条/页，目标会翻页漏查
              manager_aid=$(gh api --paginate "repos/$TARGET_REPO/actions/runs/$run_id/artifacts?per_page=100" \
                --jq '.artifacts[] | select(.name == "Manager-release" and (.expired | not)) | .id' | head -n 1)

              if [ -z "$manager_aid" ]; then
                  echo "⏭️ No (unexpired) Manager-release artifact found in run $run_id. Skipping."
                  continue
              fi

              echo "✅ Found Manager-release ($manager_aid). Downloading..."

              # 创建以 action ID 命名的文件夹并进入
              mkdir -p "$run_id"
              cd "$run_id"

              gh api "repos/$TARGET_REPO/actions/artifacts/$manager_aid/zip" > Manager-release.zip
              unzip -q -o Manager-release.zip
              rm -f Manager-release.zip

              # 把所有 APK 挪到当前目录，其余产物文件一律丢弃
              find . -type f -name "*.apk" -exec mv -f {} . \;
              rm -rf apk

              # 检索目标 apk 文件并提取五位版本号
              # 使用正则匹配形如 BakaSU_*_?????-*.apk 的文件（ReSukiSU 为改名前的旧命名）
              apk_file=$(find . -maxdepth 1 \( -name "BakaSU*_[0-9][0-9][0-9][0-9][0-9]-*.apk" -o -name "ReSukiSU*_[0-9][0-9][0-9][0-9][0-9]-*.apk" \) | head -n 1)

              if [ -n "$apk_file" ]; then
                  # 提取连续的5位数字
                  if [[ "$apk_file" =~ _([0-9]{5})-.*\.apk$ ]]; then
                      five_digits="${BASH_REMATCH[1]}"
                      release_name="v${five_digits}"

                      echo "🎉 Preparing to publish release: $release_name with tag: $tag_name"

                      # 将当前文件夹下的所有 APK 收集为 release 资产
                      assets=()
                      for file in *.apk; do
                          if [ -f "$file" ]; then
                              assets+=("$file")
                          fi
                      done

                      # 发布 Release
                      if [ ${#assets[@]} -gt 0 ]; then
                          release_notes=$(printf "%s\n\n**原始 Action 链接:** %s" "$run_title" "$run_url")
                          gh release create "$tag_name" "${assets[@]}" --title "$release_name" --notes "$release_notes"
                          echo "✅ Release $release_name created successfully!"
                      else
                          echo "❌ No APK found to release after cleanup."
                      fi
                  else
                      echo "❌ Could not extract 5 digits from filename: $apk_file"
                  fi
              else
                  echo "❌ Required APK pattern (BakaSU_*_XXXXX-*.apk) not found. Skipping release."
              fi

              # 退出文件夹并清理，以免影响下一个循环
              cd ..
              rm -rf "$run_id"
          done
          echo "All done!"
